name: CampusPing check
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
concurrency:
  group: campusping
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check LMS and send alerts
        env:
          LMS_USER: ${{ secrets.LMS_USER }}
          LMS_PASS: ${{ secrets.LMS_PASS }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASS }}
          DASH_KEY: ${{ secrets.DASH_KEY }}
        run: python main.py --once
      - name: Save what we've already seen
        id: save
        run: |
          git config user.name "campusping-bot"
          git config user.email "campusping-bot@users.noreply.github.com"
          git add state.json docs/data.enc.json
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            git push
            echo "pushed=1" >> "$GITHUB_OUTPUT"
          fi
      # Commits made by the workflow's own token don't trigger a Pages build, so ask for one explicitly.
      - name: Publish dashboard
        if: steps.save.outputs.pushed == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "/repos/${{ github.repository }}/pages/builds"
